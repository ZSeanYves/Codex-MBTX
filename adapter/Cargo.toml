[package]
name = "codex-mbtx-contract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mbtx-observe"
path = "src/main.rs"

[[bin]]
name = "mbtx-eval"
path = "src/eval.rs"

[[bin]]
name = "mbtx-fixture"
path = "src/fixture.rs"

[[bin]]
name = "mbtx-startup"
path = "src/startup.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[profile.dev]
debug = 0
