[package]
name = "codex-mbtx-contract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mbtx-observe"
path = "src/main.rs"

[[bin]]
name = "mbtx-eval"
path = "src/eval.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
