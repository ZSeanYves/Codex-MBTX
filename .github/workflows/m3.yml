name: M3 Codex Adapter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: "0.10.11+6ff76a5f9"

jobs:
  codex-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      NEXTEST_RETRIES: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev bubblewrap

      - name: Enable Codex sandbox namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.143

      - name: Prepare pinned Codex source
        run: |
          moon update
          moon run scripts/codex.mbtx

      - name: Install pinned Rust toolchain
        working-directory: _build/codex-upstream/codex-rs
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            adapter -> target
            _build/codex-upstream/codex-rs -> target

      - name: Rust protocol tests
        run: cargo test --locked --manifest-path adapter/Cargo.toml

      - name: Protocol Clippy
        run: cargo clippy --locked --manifest-path adapter/Cargo.toml --all-targets -- -D warnings

      - name: Protocol formatting
        run: cargo fmt --manifest-path adapter/Cargo.toml -- --check

      - name: Codex mock model and real runner integration
        run: moon run scripts/m3_test.mbtx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-integration-results
          path: _build/codex-upstream/codex-rs/target/nextest/mbtx/junit.xml
          if-no-files-found: warn

      - name: Affected Codex regression tests
        working-directory: _build/codex-upstream
        run: just test --locked --profile default -p codex-core -p codex-config --lib -E 'package(codex-config) | test(config::) | test(tools::spec_plan::)'

      - name: Codex Clippy
        working-directory: _build/codex-upstream/codex-rs
        run: cargo clippy --locked -p codex-core --lib --test mbtx -- -D warnings

      - name: Verify Rust formatting
        working-directory: _build/codex-upstream/codex-rs
        run: cargo fmt --all -- --check

      - name: Verify config schema
        working-directory: _build/codex-upstream
        run: just write-config-schema

      - name: Verify reproducible integration patch
        run: |
          moon run scripts/codex.mbtx capture
          git diff --exit-code

      - name: Build Codex and MBTX executables
        run: moon run scripts/m3_build.mbtx

      - name: Archive executable permissions
        run: tar -czf _build/codex-mbtx-linux-x86_64.tar.gz -C _build/m3-dist .

      - uses: actions/upload-artifact@v4
        with:
          name: codex-mbtx-linux-x86_64
          path: _build/codex-mbtx-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-test-results
          path: _build/codex-upstream/codex-rs/target/nextest/**/junit.xml
          if-no-files-found: warn
