name: Execution checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            code:
              - 'launcher/**'
              - 'cmd/**'
              - 'evaluation/**'
              - 'adapter/**'
              - 'codex/**'
              - 'scripts/**'
              - 'moon.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  fast:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MBTX_BUILD_PROFILE: dev
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapter
      - name: Check MoonBit and generated interfaces
        run: |
          moon update
          moon check --target native --deny-warn
          moon test --target native
          moon info
          moon fmt
          git diff --exit-code
      - name: Compile automation without running installers or relay calls
        run: |
          for entry in scripts/*.mbtx; do moon run --build-only "$entry"; done
      - name: Rust format, launcher contracts and parser tests
        run: |
          cargo fmt --manifest-path adapter/Cargo.toml --check
          moon run scripts/verify-offline.mbtx fast
      - name: Codex preparation regression
        run: moon run scripts/check-codex-preparation.mbtx

  integration:
    needs: [changes, fast]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MBTX_BUILD_PROFILE: dev
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang bubblewrap
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned upstream
        run: |
          moon update
          moon run scripts/codex.mbtx prepare
      - name: Enable and check sandbox namespaces on the disposable runner
        run: moon run scripts/configure-ci-linux.mbtx
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            adapter
            _build/codex-upstream/codex-rs
          key: linux-native-dev-${{ hashFiles('codex/Cargo.lock', 'codex/upstream.json', 'rust-toolchain.toml', 'adapter/Cargo.lock', 'adapter/src/fixture.rs') }}
      - name: Reuse one bundle for real Codex replay and injected faults
        run: moon run scripts/verify-offline.mbtx full
      - name: Preserve offline verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-offline-verification
          path: |
            /tmp/mbtx-replay-*
            /tmp/mbtx-faults-*
            /tmp/mbtx-interrupted-*
            /tmp/mbtx-policy-*
            _build/bundles/*/bundle.json
            _build/bundles/*/inputs.txt
            _build/bundles/*/binaries.sha256
          if-no-files-found: ignore

  required:
    name: Required checks
    if: always()
    needs: [changes, fast, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required status
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$CHANGES" = success
          test "$FAST" = success -o "$FAST" = skipped
          test "$INTEGRATION" = success -o "$INTEGRATION" = skipped
