name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --deny-warn

      - name: Test
        run: moon test

      - name: Exercise JSONL CLI
        run: moon run scripts/smoke.mbtx

      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
