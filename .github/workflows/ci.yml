name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: "0.10.11+6ff76a5f9"

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --deny-warn --target ${{ matrix.target }}

      - name: Test
        run: moon test --target ${{ matrix.target }}

      - name: Exercise JSONL CLI
        run: moon run scripts/smoke.mbtx

      - name: Exercise job lifecycle CLI
        run: moon run scripts/jobs_smoke.mbtx ${{ matrix.target }}

      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
