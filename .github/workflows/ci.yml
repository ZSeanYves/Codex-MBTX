name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: "0.10.12+1634b282e"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies
        run: moon update
      - name: Build standalone automation entry points
        env:
          MOON_DEP_CACHE: ${{ runner.temp }}/mbtx-script-deps
        run: |
          moon run --build-only scripts/install-linux.mbtx
          moon run --build-only scripts/codex.mbtx
          moon run --build-only scripts/prepare-codex-v8.mbtx
          moon run --build-only scripts/collect-linux.mbtx
          moon run --build-only scripts/collect-macos.mbtx
          moon run --build-only scripts/collect-linux-online.mbtx
      - name: MoonBit checks and tests
        run: |
          moon check --deny-warn --target native
          moon test --target native
          moon info
          moon fmt
          git diff --exit-code
      - name: Launcher smoke test
        run: |
          bin=$(moon run --build-only --output-json --target native cmd/mbtx | sed -n 's/.*"\(.*mbtx.exe\)".*/\1/p')
          test "$($bin exec -- printf '%s' literal)" = literal
          set +e
          $bin exec -- sh -c 'kill -TERM "$$"'
          code=$?
          test "$code" -eq 143
      - name: Observer and report checks
        run: cargo test --locked --manifest-path adapter/Cargo.toml
      - name: Codex preparation regression checks
        run: moon run scripts/check-codex-preparation.mbtx
      - name: Compile pinned Codex network dependencies
        if: github.event_name != 'pull_request'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          moon run scripts/codex.mbtx prepare
          cargo check --locked --manifest-path _build/codex-upstream/codex-rs/Cargo.toml -p codex-network-proxy
          cmp codex/Cargo.lock _build/codex-upstream/codex-rs/Cargo.lock
